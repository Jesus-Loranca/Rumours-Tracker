<filters
	[years]="uniqueYears"
	[yearFilterDisabled]="yearFilterDisabled"
	(filterByYearEvent)="filterByYearEventHandler($event)"
	[tags]="uniqueTags"
	[tagFilterDisabled]="tagFilterDisabled"
	(filterByTagEvent)="filterByTagEventHandler($event)"
	(orderByEvent)="orderByEventHandler($event)"
	(unresolvedButtonEvent)="unresolvedButtonEventHandler($event)"
	(useGridViewButtonEvent)="useGridViewButtonEventHandler($event)"
>
</filters>
<counter [rumourEngines]="rumourEngines"></counter>

@if (!useGridView) {
<div>
	<vertical-timeline [rumourEngines]="rumourEngines"></vertical-timeline>
</div>
}

@if (useGridView) {
<div>
	<grid-view [rumourEngines]="rumourEngines"></grid-view>
</div>
}

<back-to-top></back-to-top>
