<button type="button" *ngIf="showScrollBtn" class="btn btn-primary scroll-btn down" (click)="scrollToBottom()">
	<i class="bi bi-chevron-double-down"></i>
</button>

<button type="button" *ngIf="showScrollBtn" class="btn btn-primary scroll-btn up" (click)="scrollToTop()">
	<i class="bi bi-chevron-double-up"></i>
</button>
