<div class="timeline animate" *ngIf="rumourEngines.length > 0">
	<div class="timeline left" *ngFor="let rumourEngine of rumourEngines">
		<div *ngIf="rumourEngine.link">
			<span class="icon bounce-in">{{ getYear(rumourEngine.date) }}</span>

			<div class="content bounce-in">
				<div class="content-arrow"></div>
				<div class="row">
					<div class="tags" *ngIf="rumourEngine.tags.length > 0">
						<span *ngFor="let tag of rumourEngine.tags">{{ tag }}</span>
					</div>

					<div class="py-2 col-12 titles" *ngIf="rumourEngine">
						<a href="{{ rumourEngine.miniature.link }}" class="miniature-name">{{ rumourEngine.miniature.name }}
							<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-up-right" viewBox="0 0 16 16">
								<path fill-rule="evenodd" d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5"/>
								<path fill-rule="evenodd" d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0z"/>
							</svg>
						</a>
						<a href="{{ rumourEngine.link }}" class="rumour-engine-dates">{{ getDetailedDate(rumourEngine.date) }}
							<span class="resolved-time">Solved after {{ getResolvedDate(rumourEngine.date, rumourEngine.resolvedDate) }} days</span>
							<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-up-right" viewBox="0 0 16 16">
								<path fill-rule="evenodd" d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5"/>
								<path fill-rule="evenodd" d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0z"/>
							</svg>
						</a>
					</div>

					<div class="py-2 col-12 images" *ngIf="rumourEngine">
						<img class="col-12 col-md-3" src="{{  '../assets/images/' + rumourEngine.rumourEngineImage.url }}">
						<img class="col-12 col-md-3" src="{{ rumourEngine.rumourEngineImage.cdn }}">
						<img class="col-12 col-md-3" src="{{  '../assets/images/' + rumourEngine.miniature.image.url }}">
						<img class="col-12 col-md-3" src="{{ rumourEngine.miniature.image.cdn }}">

						<!-- <img class="col-12 col-md-6" src="{{ rumourEngine.rumourEngineImage.cdn }}">
						<img class="col-12 col-md-6" src="{{ rumourEngine.miniature.image.cdn }}"> -->
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
