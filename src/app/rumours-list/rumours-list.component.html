<section class="rumours-list-page py-4">
	<app-rumours-index [viewMode]="viewMode" [recentOnly]="recentOnly"></app-rumours-index>
	<div class="container view-toggle-wrapper">
		<div class="view-toggle-card" role="group" aria-label="Rumours view selector">
			<a class="view-toggle-btn" [class.active]="viewMode === 'active'" [routerLink]="['/rumours-list']" [queryParams]="{ view: null }">Active</a>
			<a class="view-toggle-btn" [class.active]="viewMode === 'solved'" [routerLink]="['/rumours-list']" [queryParams]="{ view: 'solved' }">Solved</a>
		</div>
		<button *ngIf="viewMode === 'active'" type="button" class="recent-toggle-btn" [class.active]="recentOnly" (click)="toggleRecentOnly()">
			Recent
		</button>
		<button *ngIf="viewMode === 'solved'" type="button" class="recent-toggle-btn" [class.active]="showLegitRumours" (click)="toggleLegitRumours()">
			Legit Rumours
		</button>
		<button *ngIf="viewMode === 'solved'" type="button" class="recent-toggle-btn" [class.active]="showWrongRumours" (click)="toggleWrongRumours()">
			Wrong Rumours
		</button>
	</div>
	<app-rumours-list-items [viewMode]="viewMode" [recentOnly]="recentOnly" [legitRumourFilter]="showLegitRumours" [wrongRumourFilter]="showWrongRumours"></app-rumours-list-items>
<back-to-top></back-to-top>
</section>
