<li class="rumours-list-item">
	@if (rumour.source.length && rumour.source[0]) {
		<a [href]="rumour.source[0]" target="_blank" rel="noopener noreferrer">
			{{ rumour.text }} <i class="bi bi-box-arrow-up-right"></i>
			@if (rumour.edition) {
				<span class="edition-pill">{{ rumour.edition | ordinal }} Edition</span>
			}
		</a>
	} @else {
		<span>
			{{ rumour.text }}
			@if (rumour.edition) {
				<span class="edition-pill">{{ rumour.edition | ordinal }} Edition</span>
			}
		</span>
	}
</li>
