<form class="row filters">
	<div class="col-3">
			<select class="form-control" id="filterByYear" name="filterByYear" [(ngModel)]="filterByYear" (change)="onFilterByYearChange()">
				<option value="">-</option>
				<option value="{{ year }}" *ngFor="let year of years">{{ year }}</option>
			</select>
			<label for="filterByYear">Filter by Year</label>
	</div>

	<div class="col-3">
		<select class="form-control" id="filterByTag" name="filterByTag" [(ngModel)]="filterByTag" (change)="onFilterByTagChange()">
			<option value="">-</option>
			<option value="{{ tag }}" *ngFor="let tag of tags">{{ tag }}</option>
		</select>
		<label for="filterByTag">Filter by Tag</label>
	</div>

	<div class="col-3">
		<select class="form-control" id="orderBy" name="orderBy" [(ngModel)]="orderBy" (change)="onOrderByChange()">
				<option value="oldest">Oldest First</option>
				<option value="current">Current First</option>
		</select>
		<label for="orderBy">Order By</label>
	</div>

	<div class="col-2">
		<button type="button" class="btn btn-primary" (click)="triggerUnresolvedButton()">{{ unresolvedButtonText }}</button>
	</div>

	<div class="col-1">

	</div>
</form>
